<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>桂桂之友大考驗</title>
<style>
:root{--ink:#282439;--plum:#6652a1;--cream:#fff8ec;--paper:#ffffff;--line:#303042}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:radial-gradient(circle at 9% 8%,#fff4d9,transparent 35%),radial-gradient(circle at 90% 26%,#e6dcff,transparent 35%),#f8f5f0;min-height:100vh}.wrap{max-width:1160px;margin:auto;padding:30px 20px 50px}.eyebrow{color:#7654a4;letter-spacing:.18em;font-weight:850;font-size:.8rem}.hero{text-align:center;margin-bottom:23px}.hero h1{font-size:clamp(2rem,5vw,3.6rem);letter-spacing:.06em;margin:5px 0 8px}.hero p{margin:0;color:#6a6674}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:20px}.panel{background:rgba(255,255,255,.93);border:1px solid #e7dfd8;border-radius:26px;box-shadow:0 14px 40px #5b447215;padding:20px}.canvas{position:relative;background:#fffaf1;border:2px dashed #e5d7ca;border-radius:20px;min-height:490px;display:flex;align-items:center;justify-content:center;overflow:hidden}.canvas:before{content:'✦';position:absolute;font-size:48px;color:#eddcc1;left:4%;top:10%}.canvas:after{content:'✳';position:absolute;font-size:45px;color:#e6d4f5;right:5%;top:22%}svg.dog{width:min(100%,760px);max-height:620px;overflow:visible;filter:drop-shadow(0 7px 0 #bdb3a92b)}.zone{fill:#fff;stroke:var(--line);stroke-width:4;stroke-linejoin:round;stroke-linecap:round;cursor:pointer;transition:fill .16s,filter .16s}.zone:hover:not(.done){filter:drop-shadow(0 0 6px #a28ce7);stroke:#7956bc}.zone:focus{outline:none;stroke:#7050b2;stroke-width:6}.zone.done{cursor:default}.zone.active{stroke:#8b52db;stroke-width:7;filter:drop-shadow(0 0 7px #b785ef)}.color:disabled{opacity:.5;cursor:not-allowed}.color:disabled .swatch{filter:grayscale(.5)}.detail{fill:none;stroke:#343142;stroke-width:3.5;stroke-linecap:round;pointer-events:none}.nose{fill:#35313b;pointer-events:none}.eyes{fill:#28232d;pointer-events:none}.spark{fill:#fff;pointer-events:none}.mouth{fill:none;stroke:#35313b;stroke-width:4;stroke-linecap:round;pointer-events:none}.tag{position:absolute;left:16px;bottom:12px;background:#fff;box-shadow:0 3px 12px #0001;border-radius:20px;padding:7px 12px;font-size:.78rem;color:#7a7180}.scorebox{display:flex;align-items:baseline;justify-content:space-between;background:#f1eafa;padding:17px 20px;border-radius:18px}.scorebox strong{font-size:2.5rem;font-variant-numeric:tabular-nums;color:#59418b}.scorebox span{font-size:.9rem;color:#7b688b}.bar{height:12px;background:#eae3f1;border-radius:50px;overflow:hidden;margin:16px 0 5px}.bar>div{height:100%;width:0;background:linear-gradient(90deg,#aa8ddb,#6c4dae);transition:width .25s}.status{font-size:.92rem;color:#746d7b;min-height:44px;margin:6px 0 14px;line-height:1.5}.side h2{font-size:1.12rem;margin:17px 0 12px}.palette{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.color{border:2px solid #ece5e2;background:white;border-radius:14px;padding:9px;display:flex;align-items:center;gap:10px;font-weight:750;color:#3d3546;cursor:pointer}.color[aria-pressed=true]{border-color:#7353a8;box-shadow:0 0 0 3px #e8dcfa;background:#faf7ff}.swatch{width:30px;height:30px;flex-shrink:0;border-radius:50%;border:2px solid #302b3480}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}button{font:inherit}button.action{border:0;padding:13px 8px;border-radius:13px;background:#eee8f4;color:#4d3c72;cursor:pointer;font-weight:750}button.action.primary{background:#7254ac;color:white}button:focus-visible{outline:3px solid #d2b7fc;outline-offset:3px}.hint{background:#fff8eb;border-left:4px solid #efc37b;border-radius:9px;padding:13px;margin-top:15px;font-size:.88rem;line-height:1.65;color:#695648}.note{font-size:.82rem;line-height:1.6;color:#78717e;margin-top:14px}.toast{min-height:28px;color:#684e93;font-weight:700;margin-top:12px;font-size:.9rem}.stats{display:flex;gap:12px;font-size:.86rem;color:#69616e;flex-wrap:wrap}.stats b{color:#343044}.confetti{pointer-events:none;position:fixed;inset:0;overflow:hidden}.confetti i{position:absolute;top:-30px;width:10px;height:18px;border-radius:2px;animation:fall 2.6s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(820deg);opacity:0}}dialog{border:0;border-radius:25px;padding:28px;width:min(90vw,430px);text-align:center;box-shadow:0 22px 80px #2b1b4b52}dialog::backdrop{background:#1f153b80}dialog h2{font-size:1.7rem;margin:6px 0}dialog p{line-height:1.7}dialog .action{min-width:150px}.legend{font-size:.8rem;color:#777;line-height:1.6;margin:9px 0}@media(max-width:820px){.layout{grid-template-columns:1fr}.canvas{min-height:390px}.wrap{padding:22px 12px}.panel{padding:13px}.hero{margin-bottom:18px}.side{padding:20px}}
</style>
</head>
<body>
<div class="wrap"><header class="hero"><div class="eyebrow">🐾 GUIGUI COLOR CHALLENGE 🐾</div><h1>桂桂之友大考驗</h1><p>真正了解桂桂的朋友，知道她每一塊毛色應該在哪裡！</p></header>
<main class="layout"><section class="panel"><div class="canvas"><svg class="dog" viewBox="0 0 780 535" role="group" aria-label="桂桂站立的自然比例黑柴線稿，身體側向右方，轉頭看著玩家。先點部位再選顏色">

<!-- neck and ruff, behind head -->
<path class="zone" data-name="頸背黑毛" data-answer="black" d="M276 205 Q326 190 353 231 Q365 254 377 293 Q385 335 350 362 L308 342 Q264 300 254 265 Z"/>
<path class="zone" data-name="胸前白毛" data-answer="cream" d="M270 272 Q299 297 330 288 Q348 325 361 350 Q351 372 338 388 Q329 374 317 391 Q309 375 298 388 Q282 359 265 348 Q247 318 270 272 Z"/>
<!-- near front leg -->
<path class="zone" data-name="前腿黑毛" data-answer="black" d="M302 350 Q326 359 345 348 Q358 366 345 400 L342 445 L286 444 Q293 395 284 375 Z"/>

<path class="zone" data-name="左耳外緣" data-answer="black" d="M157 162 Q135 123 132 64 Q130 40 145 28 Q160 18 182 51 Q207 80 213 139 Z"/>

<path class="zone" data-name="額頭與頭部黑毛" data-answer="black" d="M245 116 C184 110 146 141 129 177 Q112 215 124 263 Q135 307 167 327 Q208 349 253 342 Q305 344 335 315 Q367 282 361 236 Q361 170 323 143 Q290 120 245 116 Z"/>
<!-- cheeks shaped as realistic urajiro white crescents -->
<path class="zone" data-name="左側白頰毛" data-answer="cream" d="M128 236 Q143 257 168 259 Q182 262 195 290 Q198 316 184 331 Q147 318 135 292 Q121 268 128 236 Z"/>
<path class="zone" data-name="右側白頰毛" data-answer="cream" d="M356 235 Q341 255 317 261 Q300 266 290 292 Q287 317 302 331 Q336 317 349 291 Q363 262 356 235 Z"/>
<path class="zone" data-name="左側焦糖眉" data-answer="tan" d="M164 200 Q165 181 179 169 Q191 162 202 180 Q207 193 196 206 Q176 219 164 200 Z"/>

<!-- tan accents at edges of muzzle -->
<path class="zone" data-name="左嘴側焦糖毛" data-answer="tan" d="M193 243 Q213 240 222 255 L213 277 Q194 285 178 274 Q178 255 193 243 Z"/>

<path class="zone" data-name="嘴吻奶油毛" data-answer="cream" d="M241 250 Q217 250 201 270 Q184 289 198 316 Q214 337 242 342 Q272 342 290 316 Q306 289 287 269 Q270 249 241 250 Z"/>
<!-- Noninteractive eyes, expression, snout and fur detail -->
<path class="detail" d="M166 224 Q182 216 198 226 M286 225 Q299 216 317 222" stroke-width="2.4"/>
<ellipse class="eyes" cx="187" cy="233" rx="11" ry="13"/><ellipse class="eyes" cx="300" cy="232" rx="11" ry="13"/>
<circle class="spark" cx="184" cy="228" r="3.5"/><circle class="spark" cx="297" cy="227" r="3.5"/>
<path class="nose" d="M220 275 Q242 267 263 274 Q270 281 261 290 Q249 299 241 300 Q230 298 219 288 Q214 280 220 275 Z"/>
<path class="mouth" d="M242 299 L242 306 Q224 324 212 308 M242 306 Q258 326 273 308" stroke-width="3"/>
<path class="detail" d="M201 299 l-16 -5 M201 307 l-19 1 M282 299 l16 -5 M281 307 l20 1" stroke-width="1.6" opacity=".8"/>
<path class="detail" d="M302 478 l-1 12 M317 480 l1 11 M348 482 l0 10 M582 482 l-1 9 M603 480 l2 11 M626 479 l2 11 M357 478 l1 11" stroke-width="2"/>

</svg><div class="tag">填色區域：<span id="currentName">請先點選桂桂的身體部位</span></div></div>
<div class="toast" id="toast" aria-live="polite">第一步：先點選桂桂的身體部位。</div></section>
<aside class="panel side"><div class="scorebox"><div><span>目前得分</span><br><strong id="score">0</strong> <span>/ 100 分</span></div></div><div class="stats"><span>答錯次數：<b id="mistakes">0</b></span></div><p class="status" id="status">先點選要作答的部位，再選擇毛色，答對就能填上顏色。</p><h2>🎨 第二步：選擇該部位的顏色</h2><div class="palette" role="group" aria-label="可用顏色">
<button class="color" type="button" data-color="black" aria-pressed="true"><span class="swatch" style="background:#25252d"></span>曜石黑</button>
<button class="color" type="button" data-color="cream" aria-pressed="false"><span class="swatch" style="background:#fff0d4"></span>奶油白</button>
<button class="color" type="button" data-color="tan" aria-pressed="false"><span class="swatch" style="background:#c98e52"></span>焦糖棕</button>
<button class="color" type="button" data-color="pink" aria-pressed="false"><span class="swatch" style="background:#e7a6ad"></span>耳朵粉</button>
</div><div class="controls"><button class="action" id="restartBtn">↺ 重新挑戰</button><button class="action primary" id="revealBtn">👀 公布答案</button></div><div class="hint" id="hintBox">遊戲規則：先點選身體部位，再挑選顏色。答對得分，答錯不會上色，每答錯一次扣 3 分。全答對且無扣分可拿 100 分！</div><p class="note">以桂桂的真實毛色和柴犬比例為參考繪製的站姿線稿。正確作答的區域會自動鎖定。可使用滑鼠、觸控或鍵盤操作。</p></aside></main></div>
<dialog id="resultDialog"><div style="font-size:52px">🏆</div><h2 id="resultTitle">挑戰完成！</h2><p id="resultMessage"></p><button class="action primary" id="dialogRestart">再玩一次</button></dialog><div class="confetti" id="confetti"></div>
<script>
(()=>{'use strict';
const colors={black:'#25252d',cream:'#fff0d4',tan:'#c98e52',pink:'#e7a6ad'};
const names={black:'曜石黑',cream:'奶油白',tan:'焦糖棕',pink:'耳朵粉'};
const zones=[...document.querySelectorAll('.zone')],total=zones.length;
let selectedZone=null,done=new Set(),mistakes=0,ended=false;
const $=id=>document.getElementById(id);
function notify(t){$('toast').textContent=t;$('status').textContent=t}
function score(){return Math.max(0,Math.round(done.size/total*100-mistakes*3))}
function update(){ $('score').textContent=score();$('mistakes').textContent=mistakes;document.querySelectorAll('.color').forEach(b=>b.disabled=!selectedZone||ended);}
function selectZone(z){if(ended||done.has(z))return;zones.forEach(x=>x.classList.remove('active'));selectedZone=z;z.classList.add('active');$('currentName').textContent=z.dataset.name;notify(`已選「${z.dataset.name}」，請在右側選擇正確毛色。`);update()}
function paint(color){if(ended||!selectedZone)return;const z=selectedZone,name=z.dataset.name;if(z.dataset.answer===color){z.style.fill=colors[color];z.classList.remove('active');z.classList.add('done');z.setAttribute('aria-label',name+'（已完成）');done.add(z);selectedZone=null;$('currentName').textContent='請選擇下一個身體部位';notify(`✅ 答對！「${name}」是${names[color]}。繼續選擇其他部位！`);update();if(done.size===total)finish()}else{mistakes++;notify(`❌ 「${name}」不是${names[color]}，再試一次！（扣 3 分）`);update();z.animate([{transform:'translateX(0)'},{transform:'translateX(3px)'},{transform:'translateX(-3px)'},{transform:'translateX(0)'}],{duration:220})}}
function finish(){ended=true;update();const points=score(),rank=points>=95?'桂桂的超級知己 🥇':points>=80?'桂桂的好朋友 🥈':points>=60?'桂桂的熟面孔 🥉':'繼續認識桂桂吧 🐕';$('resultTitle').textContent=rank;$('resultMessage').innerHTML=`你完成了全部 ${total} 個部位！<br><strong style="font-size:2rem;color:#684c9b">${points} / 100 分</strong><br>答錯 ${mistakes} 次。`;setTimeout(()=>$('resultDialog').showModal(),350);if(points>=80)celebrate()}
function celebrate(){const c=$('confetti');for(let i=0;i<50;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=['#f5ba73','#a893eb','#7fbfb0','#eea6b0'][i%4];e.style.animationDelay=Math.random()*.7+'s';c.append(e);setTimeout(()=>e.remove(),3400)}}
function reset(){ended=false;done.clear();mistakes=0;selectedZone=null;zones.forEach(z=>{z.style.fill='';z.classList.remove('done','active');z.setAttribute('aria-label',z.dataset.name)});$('hintBox').textContent='遊戲規則：先點選身體部位，再挑選顏色。答對得分，答錯不會上色，每答錯一次扣 3 分。全答對且無扣分可拿 100 分！';$('currentName').textContent='請先點選桂桂的身體部位';if($('resultDialog').open)$('resultDialog').close();notify('第一步：先點選桂桂的身體部位。');update()}
zones.forEach(z=>{z.addEventListener('click',()=>selectZone(z));z.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectZone(z)}})});
document.querySelectorAll('.color').forEach(b=>b.addEventListener('click',()=>paint(b.dataset.color)));
$('restartBtn').addEventListener('click',reset);$('dialogRestart').addEventListener('click',reset);
$('revealBtn').addEventListener('click',()=>{if(ended)return;if(!confirm('公布全部答案將結束本次挑戰，不計入正式得分。確定嗎？'))return;zones.forEach(z=>{z.style.fill=colors[z.dataset.answer];z.classList.remove('active');z.classList.add('done')});selectedZone=null;ended=true;notify('已公布桂桂的完整毛色！按「重新挑戰」再玩一次。');$('hintBox').textContent='👀 黑色：頭頂、耳外、背部和腿上段；奶油白：臉頰、嘴邊、胸腹；焦糖棕：眉毛、鼻梁與腳；粉色：耳內。';update()});
update();
})();
</script>
</body></html>
